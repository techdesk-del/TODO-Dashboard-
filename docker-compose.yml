# ============================================================
# UrbanGaon AI Todo Platform — Docker Compose
# Fully Private Self-Hosted Setup (No Third-Party Data Access)
# ============================================================

services:
  # ── Local MongoDB (your data stays on YOUR machine) ───────
  mongodb:
    image: mongo:7
    container_name: urbangaon-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: urbangaon_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-urbangaon_secure_2026}
      MONGO_INITDB_DATABASE: urbangaon_todo
    volumes:
      # Data persists here even if container is removed
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Next.js App ───────────────────────────────────────────
  urbangaon-todo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

    container_name: urbangaon-todo
    restart: always

    # Only accessible on your local network
    ports:
      - "3000:3000"

    # Wait for MongoDB to be ready before starting
    depends_on:
      mongodb:
        condition: service_healthy

    environment:
      - NODE_ENV=production
      # Points to the LOCAL MongoDB container (not cloud!)
      - MONGODB_URI=mongodb://urbangaon_admin:${MONGO_PASSWORD:-urbangaon_secure_2026}@mongodb:27017/urbangaon_todo?authSource=admin
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}

    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/cron"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

# Persistent volume for MongoDB data
volumes:
  mongodb_data:
    driver: local
