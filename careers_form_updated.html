<div class="btCareer">
<div class="btCareerRow">
<label> Name</label>
[text* your-name placeholder "Enter your full name"]
</div>
<div class="btCareerRow">
<label> Email</label>
[email* your-email placeholder "Enter your email"]
</div>
<div class="btCareerRow">
<label> Contact Number</label>
[tel* your-phone placeholder "Enter your 10-digit phone number"]
</div>
<div class="btCareerRow">
<label> Job Profile</label>
<select name="your-industry" id="jobProfileSelect">
<option value="In-house Research Analyst">In-house Research Analyst</option>
<option value="EA to Director">EA to Director</option>
<option value="Head of Marketing">Head of Marketing</option>
<option value="Purchase Officer (China Exposure)">Purchase Officer (China Exposure)</option>
<option value="Assistant Manager - Sales">Assistant Manager - Sales</option>
<option value="Manager - Sales &amp; Marketing">Manager - Sales &amp; Marketing</option>
<option value="Head of Architecture">Head of Architecture</option>
<option value="Senior Accountant">Senior Accountant</option>
</select>
<div style="margin-top: 8px;">
<span id="jdToggle" style="cursor:pointer; display:inline-block; font-weight:600; color:#2563eb; font-size:13px; text-decoration:underline;">View JD</span>
</div>
<div id="jdBox" style="display:none; margin-top:10px; padding:16px 18px; border:1px solid #d1d5db; background:#ffffff; border-radius:8px; max-height:400px; overflow-y:auto; box-shadow:0 4px 14px rgba(0,0,0,0.06); font-size:13.5px; line-height:1.6; color:#1f2937;"></div>
</div>
<div class="btCareerRow">
<label> Location </label>
[select your-country "Jaipur"]
</div>
<div class="btCareerRow">
<label> Upload Your CV in PDF format only(required)</label>
[file* your-file filetypes:pdf|txt limit:2mb]
</div>
<div class="btCareerButton">
[submit "APPLY FOR JOB"]
</div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  var jdData = {
    "In-house Research Analyst": {
      title: "Role Overview: In-house Research Analyst",
      meta: [
        { label: "Department", value: "AI, IT & Research" },
        { label: "Reports To", value: "Head of AI Adoption, IT & Research" },
        { label: "Mandatory Qualification", value: "Graduate in Computer Science / IT / AI / Data Science / Engineering (or related technical discipline) — mandatory" },
        { label: "Preferred Qualification", value: "MCA / M.Tech in AI, Data Science, IT, or Business Analytics — preferred, not mandatory" },
        { label: "Experience", value: "3–6 years in market research, business or real estate research, competitive intelligence, or data analysis." }
      ],
      purpose: "Responsible for driving in-house research intelligence covering market, competitor, and technology trends to support strategic decision-making across UrbanGaon, delivering timely and actionable insights to leadership and cross-functional teams.",
      responsibilities: [
        "Conduct market research on real estate trends, pricing, and demand patterns.",
        "Track competitor projects, launches, pricing, and positioning.",
        "Monitor industry, regulatory, and technology developments relevant to the business.",
        "Build and maintain research databases and knowledge repositories.",
        "Prepare research reports, dashboards, and presentations for leadership.",
        "Support due diligence for new projects, land acquisitions, and market-entry decisions.",
        "Collaborate with sales, marketing, and strategy teams to translate research into actionable insights.",
        "Conduct primary research (surveys, site visits, customer interviews) as needed.",
        "Benchmark organisational performance against industry standards and best practices.",
        "Ensure research outputs are timely, accurate, and well-sourced."
      ],
      competencies: [
        "Strong research and analytical skills with attention to detail.",
        "Ability to synthesise large volumes of information into clear, actionable insights.",
        "Proficiency in MS Excel, PowerPoint, and research/data tools.",
        "Good understanding of real estate market dynamics (preferred).",
        "Strong written and verbal communication skills.",
        "Ability to manage multiple research requests within tight timelines.",
        "Curiosity and a proactive approach to tracking industry and market trends."
      ]
    },

    "EA to Director": {
      title: "Role Overview — EA to Director",
      meta: [
        { label: "Department", value: "Administration / Director's Office" },
        { label: "Reports To", value: "Director" },
        { label: "Qualification", value: "Graduate in any discipline — mandatory | MBA preferred" },
        { label: "Experience", value: "8–10 years of experience as an Executive Assistant / Personal Assistant / Executive Support professional." }
      ],
      purpose: "Responsible for managing the Director's calendar, confidential correspondence, meeting minutes, travel, and communication — including MIS reporting, cross-functional action tracking, document preparation, and priority coordination — to ensure seamless and efficient support to the Director.",
      responsibilities: [
        "Manage the Director's calendar, appointments, and scheduling priorities.",
        "Handle confidential correspondence and follow-ups with discretion.",
        "Prepare accurate meeting minutes and track action items to closure.",
        "Coordinate domestic and international travel arrangements and itineraries.",
        "Manage internal and external communication on behalf of the Director.",
        "Prepare and maintain MIS reports and dashboards for leadership review.",
        "Track cross-functional actions and follow-ups across departments.",
        "Prepare documents, presentations, and briefing notes for meetings.",
        "Coordinate and prioritize competing demands on the Director's time.",
        "Liaise with internal stakeholders and external contacts for smooth coordination.",
        "Maintain confidentiality and professionalism in handling sensitive matters."
      ],
      competencies: [
        "Strong communication and interpersonal skills, both written and verbal",

        "Proficiency in MS Office (Word, Excel, PowerPoint, Outlook)",
        "Excellent minute-taking and documentation skills",
        "Strong follow-up discipline and ownership of action items.",
        "Ability to multitask and manage competing priorities under pressure",
        "Professional demeanor with strong organizational and time-management skills"
      ]
    },

    "Head of Marketing": {
      title: "Role Overview: Head of Marketing",
      meta: [
        { label: "Department", value: "Marketing & Branding" },
        { label: "Reports To", value: "CEO / Managing Director" },
        { label: "Mandatory Qualification", value: "Graduation" },
        { label: "Preferred Qualification", value: "MBA in Marketing or Brand Management — strongly preferred" },
        { label: "Experience", value: "10–15 years of experience in marketing and branding leadership, with a proven track record of building brands, leading high-performing teams, and driving marketing strategy in real estate or a related consumer-facing industry." }
      ],
      purpose: "Responsible for defining and driving the overall brand and marketing strategy for UrbanGaon — including brand positioning, project launches, digital presence, campaign strategy, team leadership, and agency management — to build a market-leading brand and support business growth and sales objectives.",
      responsibilities: [
        "Define and drive the overall marketing and brand strategy for UrbanGaon across all projects and business lines.",
        "Lead planning and execution of integrated marketing campaigns aligned to business and sales targets.",
        "Build and lead a high-performing marketing team across branding, digital, content, and events.",
        "Own the brand architecture, positioning, and guidelines, ensuring consistency across all projects and touchpoints.",
        "Drive project launch strategy, go-to-market planning, and marketing readiness across new developments.",
        "Oversee digital marketing, social media, and content strategy to build brand equity and generate leads.",
        "Manage marketing budgets, agency partnerships, and vendor relationships to optimize spend and quality.",
        "Partner with sales and CRM leadership to align marketing strategy with lead generation and conversion goals.",
        "Track, analyze, and report on marketing performance, brand metrics, and ROI to leadership.",
        "Represent the brand externally, building relationships with media, industry bodies, and key stakeholders."
      ],
      competencies: [
        "Proven leadership in building and scaling marketing and brand functions, ideally in real estate or a related industry.",
        "Strong strategic thinking with the ability to translate business goals into marketing plans.",
        "Excellent team leadership, coaching, and people management skills.",
        "Deep expertise across brand, digital, content, and campaign management.",
        "Strong stakeholder management skills, including senior leadership, agencies, and media.",
        "Data-driven decision-maker, comfortable with budgets, ROI, and performance metrics.",
        "Exceptional communication and presentation skills."
      ]
    },

    "Purchase Officer (China Exposure)": {
      title: "Role Overview: Purchase Officer – International Sourcing (China Exposure)",
      meta: [
        { label: "Department", value: "Procurement / Supply Chain" },
        { label: "Reports To", value: "Procurement Manager" },
        { label: "Industry", value: "Consumer Electronics" },
        { label: "Mandatory Qualification", value: "Graduation" },
        { label: "Preferred Qualification", value: "Supply Chain / Commerce / Engineering background — an added advantage" },
        { label: "Experience", value: "5–10 years of experience in international purchase or sourcing." }
      ],
      purpose: "Responsible for sourcing materials from China and international suppliers -including preparing RFQs, comparing landed costs, negotiating terms, coordinating samples, verifying vendors, managing import documentation and logistics, and monitoring quality and supplier performance — to ensure timely, cost-effective, and quality procurement.",
      responsibilities: [
        "Source materials and equipment from Chinese and other international suppliers.",
        "Prepare and issue RFQs (Request for Quotations) to prospective vendors.",
        "Compare landed costs across suppliers, including freight, duties, and taxes.",
        "Negotiate pricing, payment terms, and delivery schedules with suppliers.",
        "Coordinate sample requests, approvals, and quality benchmarking.",
        "Conduct vendor verification and due diligence before onboarding.",
        "Prepare and manage import documents such as invoices, packing lists, and certificates of origin.",
        "Coordinate logistics, shipping, and customs clearance with freight forwarders.",
        "Monitor quality control (QC) at source and upon receipt of goods.",
        "Track and evaluate supplier performance on cost, quality, and delivery.",
        "Maintain accurate purchase records and support cost-saving initiatives."
      ],
      competencies: [
        "Strong negotiation skills with international vendors.",
        "Proficiency in Excel for cost comparison and analysis.",
        "Sound knowledge of import documentation and customs procedures.",
        "Strong written and verbal English communication skills.",
        "Ability to evaluate quality and conduct vendor due diligence.",
        "Detail-oriented with strong follow-up and coordination skills.",
        "Ability to manage multiple suppliers and shipments simultaneously."
      ]
    },

    "Assistant Manager - Sales": {
      title: "Role Overview: Assistant Manager – Sales",
      meta: [
        { label: "Department", value: "Sales" },
        { label: "Reports To", value: "Leadership / Management" },
        { label: "Industry", value: "Real Estate Development" },
        { label: "Location", value: "Jaipur, Rajasthan" },
        { label: "Qualification", value: "Graduate — mandatory | MBA — preferred, not mandatory" },
        { label: "Experience", value: "4–7 years of real estate sales experience, with strong negotiation, customer handling, channel partner network, CRM usage, and target orientation." }
      ],
      purpose: "Responsible for driving sales closures across UrbanGaon developments by managing lead follow-up, site visits, channel partner coordination, and customer counselling, while maintaining CRM discipline and ensuring accurate booking documentation and a smooth handoff to collections and customer service.",
      responsibilities: [
        "Follow up on leads promptly and convert inquiries into site visits.",
        "Conduct site visits and property walkthroughs for prospective customers.",
        "Counsel customers on project offerings, pricing, and payment plans.",
        "Coordinate with channel partners (CPs) to generate and manage leads.",
        "Negotiate terms and close sales in line with approved pricing and policies.",
        "Maintain CRM discipline — timely and accurate updates on leads, visits, and status.",
        "Prepare and process booking documentation accurately and on time.",
        "Ensure a smooth handoff of closed bookings to collections and customer service teams.",
        "Build and maintain relationships with channel partners for repeat business.",
        "Achieve monthly and quarterly sales targets as assigned."
      ],
      competencies: [
        "Strong negotiation and closing skills.",
        "Excellent customer handling and relationship-building ability.",
        "Established channel partner network and coordination skills.",
        "Disciplined CRM usage and process orientation.",
        "Target-driven with a strong sense of ownership.",
        "Good communication and presentation skills.",
        "Resilient, proactive, and self-motivated in a target-based environment."
      ]
    },

    "Manager - Sales & Marketing": {
      title: "Role Overview — Manager Sales & Marketing",
      meta: [
        { label: "Department", value: "Sales & Marketing" },
        { label: "Reports To", value: "Leadership / Management" },
        { label: "Mandatory Qualification", value: "Graduate — mandatory" },
        { label: "Preferred Qualification", value: "MBA — preferred" },
        { label: "Experience", value: "4–7 years of real estate sales experience, with strong negotiation, customer handling, channel partner network, CRM usage, and target orientation." }
      ],
      purpose: "Responsible for driving sales closures and brand visibility through lead follow-up, site visits, channel partner coordination, customer counselling, CRM discipline, booking documentation, and end-to-end marketing execution—including digital campaigns, launches, creatives, events, and performance tracking.",
      responsibilities: [
        "Follow up on leads promptly and convert inquiries into site visits.",
        "Conduct site visits and property walkthroughs for prospective customers.",
        "Counsel customers on project offerings, pricing, and payment plans.",
        "Coordinate with channel partners (CPs) to generate and manage leads.",
        "Negotiate terms and close sales in line with approved pricing and policies.",
        "Maintain CRM discipline — timely and accurate updates on leads, visits, and status.",
        "Prepare and process booking documentation accurately and on time.",
        "Ensure a smooth handoff of closed bookings to collections and customer service teams.",
        "Build and maintain relationships with channel partners for repeat business.",
        "Achieve monthly and quarterly sales targets as assigned."
      ],
      competencies: [
        "Strong negotiation and closing skills.",
        "Excellent customer handling and relationship-building ability.",
        "Established channel partner network and coordination skills.",
        "Disciplined CRM usage and process orientation.",
        "Target-driven with a strong sense of ownership.",
        "Good communication and presentation skills.",
        "Resilient, proactive, and self-motivated in a target-based environment."
      ]
    },

    "Head of Architecture": {
      title: "Role Overview — Head of Architecture",
      meta: [
        { label: "Department", value: "Architecture & Design" },
        { label: "Reports To", value: "Leadership / Management" },
        { label: "Mandatory Qualification", value: "Bachelor of Architecture (B.Arch.) with valid Council of Architecture registration" },
        { label: "Preferred Qualification", value: "Master of Architecture (M.Arch.), BIM / Sustainable Design / Project Management Certification" },
        { label: "Experience", value: "12–18+ years of progressive experience in architectural design and execution within reputed real estate developers." }
      ],
      purpose: "Responsible for leading the complete architectural function across all UrbanGaon developments by driving concept design, design development, consultant coordination, statutory approvals, value engineering, execution support and design governance while ensuring quality, compliance, cost optimization and timely project delivery",
      responsibilities: [
        "Lead concept planning through construction support.",
        "Ensure architectural excellence across all projects.",
        "Coordinate Structural, MEP, Landscape and Interior consultants.",
        "Review and approve drawings before release.",
        "Drive statutory approvals.",
        "Implement value engineering.",
        "Support execution teams through site reviews.",
        "Standardize design documentation and QA.",
        "Present designs to leadership.",
        "Develop and mentor the architecture team.",
        "Monitor industry trends and sustainable practices."
      ],
      competencies: [
        "Expertise in architectural planning and execution.",
        "Knowledge of NBC, local bye-laws and approvals.",
        "Leadership and consultant management.",
        "Value engineering and constructability review.",
        "AutoCAD, Revit, BIM and presentation skills.",
        "Excellent communication and stakeholder management.",
        "Ownership, integrity and continuous improvement mindset."
      ]
    },

    "Senior Accountant": {
      title: "Role Overview — Senior Accountant",
      meta: [
        { label: "Department", value: "Accounts & Finance" },
        { label: "Reports To", value: "Leadership / Management" },
        { label: "Mandatory Qualification", value: "Commerce Post Graduate (M.Com) — mandatory" },
        { label: "Preferred Qualification", value: "CA Inter — preferred, not mandatory" },
        { label: "Experience", value: "4–8 years of accounting experience, preferably in construction or real estate, with hands-on Tally expertise and sound working knowledge of accounting laws and statutory compliance." }
      ],
      purpose: "Responsible for leading the accounts function across UrbanGaon construction projects by ensuring accurate bookkeeping, timely statutory compliance, project-wise cost and vendor accounting, and reliable financial reporting, while maintaining strong internal controls and supporting management with MIS and audit readiness.",
      responsibilities: [
        "Lead and oversee day-to-day accounting operations, including books of accounts, ledgers, and bank and cash management.",
        "Maintain accurate and up-to-date accounts in Tally, with regular review and reconciliation.",
        "Manage project-wise accounting, including cost tracking, budget-vs-actual analysis, and work-in-progress (WIP) accounting.",
        "Process and verify contractor and vendor bills, running bills, retention, advances, and payments.",
        "Ensure timely GST, TDS, TCS, PF/ESI and other statutory filings, including RERA-related accounting requirements.",
        "Prepare monthly, quarterly, and annual financial statements and MIS reports for management.",
        "Coordinate with auditors, tax consultants, and banks for statutory audits, assessments, and financial queries.",
        "Monitor cash flow and fund requirements across projects, and maintain strong internal controls and accounting policies.",
        "Supervise, guide, and train the accounts team to ensure accuracy and timely closures."
      ],
      competencies: [
        "Strong working knowledge of Tally (ERP / Prime) and accounting software.",
        "Good hands-on knowledge of accounting laws, GST, TDS, Income Tax, and Companies Act provisions.",
        "Experience in construction or real estate accounting, including project and contractor accounting.",
        "Strong analytical, reconciliation, and MIS-preparation skills.",
        "Leadership ability to guide a team and coordinate with auditors and consultants.",
        "Good communication skills and a strong sense of ownership and integrity."
      ]
    }
  };

  var toggle = document.getElementById('jdToggle');
  var box = document.getElementById('jdBox');
  var sel = document.getElementById('jobProfileSelect');
  var currentActiveRole = '';

  function renderJD(role) {
    var d = jdData[role];
    while (box.firstChild) {
      box.removeChild(box.firstChild);
    }

    if (!d) {
      var msg = document.createElement('div');
      msg.textContent = 'Job description details not available.';
      msg.style.color = '#6b7280';
      box.appendChild(msg);
      return;
    }

    var titleEl = document.createElement('div');
    titleEl.style.cssText = 'font-size:15.5px; font-weight:700; color:#111827; margin-bottom:12px; padding-bottom:6px; border-bottom:2px solid #e5e7eb;';
    titleEl.textContent = d.title;
    box.appendChild(titleEl);

    var metaWrap = document.createElement('div');
    metaWrap.style.cssText = 'margin-bottom:14px; display:flex; flex-direction:column; gap:6px; font-size:13.5px;';
    d.meta.forEach(function(m) {
      var p = document.createElement('div');
      var b = document.createElement('strong');
      b.textContent = m.label + ': ';
      p.appendChild(b);

      if (m.highlight) {
        var hl = document.createElement('mark');
        hl.style.cssText = 'background:#fef08a; padding:1px 4px; border-radius:2px; font-weight:600; color:#000000;';
        hl.textContent = m.value;
        p.appendChild(hl);
      } else {
        p.appendChild(document.createTextNode(m.value));
      }
      metaWrap.appendChild(p);
    });
    box.appendChild(metaWrap);

    var purposeHead = document.createElement('div');
    purposeHead.style.cssText = 'font-size:13.5px; font-weight:700; color:#111827; margin:10px 0 4px 0;';
    purposeHead.textContent = 'Role Purpose:';
    var purposeBody = document.createElement('div');
    purposeBody.style.cssText = 'margin-bottom:14px; color:#374151; font-size:13.5px;';
    purposeBody.textContent = d.purpose;
    box.appendChild(purposeHead);
    box.appendChild(purposeBody);

    var respHead = document.createElement('div');
    respHead.style.cssText = 'font-size:14px; font-weight:700; color:#111827; margin:14px 0 6px 0;';
    respHead.textContent = 'Key Responsibilities';
    box.appendChild(respHead);

    var respUl = document.createElement('ul');
    respUl.style.cssText = 'margin:0 0 14px 20px; padding:0; font-size:13.5px; color:#374151;';
    d.responsibilities.forEach(function(r) {
      var li = document.createElement('li');
      li.style.marginBottom = '5px';
      li.textContent = r;
      respUl.appendChild(li);
    });
    box.appendChild(respUl);

    // Optional KRA table (shown only for roles that have "kra" data)
    if (d.kra && d.kra.length) {
      var kraHead = document.createElement('div');
      kraHead.style.cssText = 'font-size:14px; font-weight:700; color:#111827; margin:14px 0 6px 0;';
      kraHead.textContent = 'Key Result Areas & Performance Indicators';
      box.appendChild(kraHead);

      var kraWrap = document.createElement('div');
      kraWrap.style.cssText = 'overflow-x:auto; margin-bottom:14px;';

      var table = document.createElement('table');
      table.style.cssText = 'width:100%; border-collapse:collapse; font-size:13px; color:#374151;';

      var thead = document.createElement('thead');
      var hr = document.createElement('tr');
      ['KRA Area', 'KPI / Measure', 'Target', 'Wt.'].forEach(function(h) {
        var th = document.createElement('th');
        th.style.cssText = 'text-align:left; padding:6px 8px; border:1px solid #d1d5db; background:#f3f4f6; color:#111827; font-weight:700;';
        th.textContent = h;
        hr.appendChild(th);
      });
      thead.appendChild(hr);
      table.appendChild(thead);

      var tbody = document.createElement('tbody');
      d.kra.forEach(function(k) {
        var tr = document.createElement('tr');
        [k.area, k.kpi, k.target, k.wt].forEach(function(val, idx) {
          var td = document.createElement('td');
          td.style.cssText = 'padding:6px 8px; border:1px solid #d1d5db; vertical-align:top;' + (idx === 0 ? ' font-weight:600; color:#111827;' : '');
          td.textContent = val;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      kraWrap.appendChild(table);
      box.appendChild(kraWrap);
    }

    var compHead = document.createElement('div');
    compHead.style.cssText = 'font-size:14px; font-weight:700; color:#111827; margin:14px 0 6px 0;';
    compHead.textContent = 'Competencies We Are Looking For';
    box.appendChild(compHead);

    var compUl = document.createElement('ul');
    compUl.style.cssText = 'margin:0 0 6px 20px; padding:0; font-size:13.5px; color:#374151;';
    d.competencies.forEach(function(c) {
      var li = document.createElement('li');
      li.style.marginBottom = '5px';
      li.textContent = c;
      compUl.appendChild(li);
    });
    box.appendChild(compUl);

    currentActiveRole = role;
  }

  function updateJDLive() {
    var val = sel.value;
    if (box.style.display === 'block' && val !== currentActiveRole) {
      renderJD(val);
    }
  }

  toggle.addEventListener('click', function(e) {
    e.preventDefault();
    var isHidden = (box.style.display === 'none' || box.style.display === '');
    if (isHidden) {
      renderJD(sel.value);
      box.style.display = 'block';
      toggle.textContent = 'Hide JD';
    } else {
      box.style.display = 'none';
      toggle.textContent = 'View JD';
    }
  });

  sel.addEventListener('change', updateJDLive);
  sel.addEventListener('input', updateJDLive);

  if (window.jQuery) {
    window.jQuery(sel).on('change select2:select', updateJDLive);
  }

  setInterval(function() {
    if (box.style.display === 'block' && sel.value !== currentActiveRole) {
      renderJD(sel.value);
    }
  }, 100);
});
</script>
